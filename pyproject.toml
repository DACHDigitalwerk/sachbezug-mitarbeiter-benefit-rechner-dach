[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sachbezug-dach"
version = "1.0.0"
description = "DACH Sachbezug-, Essensgutschein- & Mitarbeiter-Benefit-Optimierer 2026 (DE, AT, CH)"
readme = "README.md"
authors = [{ name = "DACH Digitalwerk", email = "dach.digitalwerk@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dach-benefit = "sachbezug_dach.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
